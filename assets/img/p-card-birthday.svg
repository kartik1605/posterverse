<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#F3EADD"/>
  <!-- envelope behind -->
  <g transform="translate(600 620) rotate(6)">
    <rect x="-240" y="-160" width="480" height="320" rx="10" fill="#D9B98C"/>
    <path d="M-240 -160 L0 20 L240 -160" fill="none" stroke="#B99358" stroke-width="10"/>
  </g>
  <!-- card -->
  <g transform="translate(440 470) rotate(-5)">
    <rect x="-230" y="-300" width="460" height="600" rx="14" fill="#FAF4EB" stroke="#17130E" stroke-width="8"/>
    <!-- balloon -->
    <ellipse cx="0" cy="-90" rx="105" ry="125" fill="#FF5C1F"/>
    <path d="M0 35 q -18 40 8 78 q 22 34 -6 70" stroke="#17130E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-14 35 L14 35 L0 60 Z" fill="#FF5C1F"/>
    <ellipse cx="-34" cy="-130" rx="24" ry="34" fill="#FAF4EB" opacity=".45"/>
    <!-- confetti -->
    <g>
      <rect x="-180" y="-250" width="26" height="12" rx="6" fill="#6C3BF4" transform="rotate(30 -180 -250)"/>
      <rect x="140" y="-230" width="26" height="12" rx="6" fill="#0FA3A3" transform="rotate(-40 140 -230)"/>
      <circle cx="-150" cy="-60" r="12" fill="#FFC229"/>
      <circle cx="165" cy="-90" r="10" fill="#FF8FC7"/>
      <rect x="-170" y="140" width="26" height="12" rx="6" fill="#FFC229" transform="rotate(60 -170 140)"/>
      <circle cx="150" cy="120" r="12" fill="#6C3BF4"/>
      <rect x="90" y="220" width="26" height="12" rx="6" fill="#FF5C1F" transform="rotate(-25 90 220)"/>
      <circle cx="-120" cy="240" r="10" fill="#0FA3A3"/>
    </g>
    <!-- bunting -->
    <path d="M-230 -300 L-150 -300 L-190 -250 Z" fill="#0FA3A3"/>
    <path d="M230 -300 L150 -300 L190 -250 Z" fill="#FFC229"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="jam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset=".5" stop-color="#E44A10"/>
      <stop offset="1" stop-color="#B93608"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#F3EADD"/>
  <ellipse cx="512" cy="885" rx="300" ry="38" fill="#17130E" opacity=".12"/>
  <!-- jam jar -->
  <g transform="translate(512 560)">
    <rect x="-190" y="-250" width="380" height="570" rx="60" fill="url(#jam)"/>
    <!-- lid with gingham -->
    <rect x="-206" y="-330" width="412" height="96" rx="30" fill="#0FA3A3"/>
    <g stroke="#FAF4EB" stroke-width="10" opacity=".5">
      <line x1="-160" y1="-330" x2="-160" y2="-234"/>
      <line x1="-80" y1="-330" x2="-80" y2="-234"/>
      <line x1="0" y1="-330" x2="0" y2="-234"/>
      <line x1="80" y1="-330" x2="80" y2="-234"/>
      <line x1="160" y1="-330" x2="160" y2="-234"/>
      <line x1="-206" y1="-282" x2="206" y2="-282"/>
    </g>
    <rect x="-166" y="-240" width="60" height="530" rx="26" fill="#FAF4EB" opacity=".18"/>
    <!-- kraft label -->
    <g transform="rotate(-2)">
      <rect x="-150" y="-90" width="300" height="250" rx="16" fill="#E8D3AE" stroke="#17130E" stroke-width="7"/>
      <!-- fruit icon -->
      <circle cx="0" cy="-20" r="38" fill="#FF5C1F"/>
      <circle cx="-14" cy="-30" r="7" fill="#FAF4EB" opacity=".6"/>
      <path d="M0 -58 q 4 -22 26 -28 q 0 22 -26 28 Z" fill="#0FA3A3"/>
      <line x1="-92" y1="52" x2="92" y2="52" stroke="#17130E" stroke-width="8" stroke-linecap="round"/>
      <line x1="-60" y1="90" x2="60" y2="90" stroke="#17130E" stroke-width="8" stroke-linecap="round" opacity=".5"/>
      <path d="M-150 130 h300" stroke="#17130E" stroke-width="4" stroke-dasharray="14 10" opacity=".4"/>
    </g>
  </g>
</svg>
